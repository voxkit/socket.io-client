name: Test

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install Node dependencies
        working-directory: ./test_server
        run: npm ci
        
      - name: Start test servers
        run: |
          DEBUG=socket.io:* PORT=3000 node ./test_server/server.js &
          DEBUG=socket.io:* PORT=3001 node ./test_server/server-socket.io.js &
          # Give servers time to start
          sleep 5

      - name: Run JVM tests
        run: ./gradlew jvmTest

      - name: Run iOS tests
        run: ./gradlew iosSimulatorArm64Test
